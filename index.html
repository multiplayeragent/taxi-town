<title>Taxi Town</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #9fd6ff; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; font-weight: 800; }
  #net { top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); font-size: 12px; font-weight: 600; opacity: .9; }
  #clock { top: calc(max(10px, env(safe-area-inset-top)) + 20px); left: max(12px, env(safe-area-inset-left)); font-size: 18px; }
  #mini { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 50px); left: max(12px, env(safe-area-inset-left)); width: 136px; height: 136px; border-radius: 14px; border: 2px solid #ffffffcc; background: #2b3242cc; pointer-events: none; }
  #cash { top: max(10px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); text-align: right; font-size: 34px; line-height: 1; color: #ffd84a; }

  #event { top: calc(max(10px, env(safe-area-inset-top)) + 170px); right: max(14px, env(safe-area-inset-right)); padding: 4px 10px; border-radius: 10px; background: #ff5a5fdd; font-size: 13px; text-shadow: none; }
  #event:empty { display: none; }
  #status { left: 16px; right: 16px; top: 17%; text-align: center; font-size: 22px; }

  #padR { display: grid; grid-template-columns: auto auto; gap: 10px; align-items: end; justify-items: center; }

  .card h2 { margin: 0 0 4px; font-size: 24px; } .card h3 { margin: 16px 0 4px; font-size: 14px; color: #ffd84a; text-align: left; }
  .card ol { margin: 0; padding-left: 26px; text-align: left; font-size: 14px; }
  .card li { margin: 2px 0; } .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd84a; font-weight: 800; }
  .card li i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .card p { margin: 8px 0 0; font-size: 14px; opacity: .85; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 14px; background: #ffd84a; color: #3a2a00; font: 900 17px system-ui, sans-serif; cursor: pointer; }
  [hidden] { display: none !important; }
  .attract .hud, .attract #mini, .attract .pad { display: none !important; }
  @media (max-width: 520px) { #mini { width: 104px; height: 104px; } #cash { font-size: 28px; } #status { top: 25%; font-size: 19px; } #ranks { font-size: 12px; } #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 176px); } }
</style>

<script type="module">
/* ═══ TAXI TOWN · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Race other taxis to every fare in town. Drop-in, 2–12 players; bot taxis fill the streets.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ shift length, car handling, fares, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   TOWN .......... the street grid, blocks, stops, the 12 named places, solid kerbs
 *   SCENE ......... sky, roads, buildings, signs, parks, trees, street lamps, walkers
 *   MODELS ........ taxis, passengers, the light beams, the arrow, coins and pop-up text
 *   DRIVING ....... drive() for your taxi: pedals, steering, bumping into kerbs and other cars
 *   SHIFT (HOST) .. the shift timer, scores, passengers appearing, pickups, drop-offs, pay
 *   BOTS (HOST) ... bot taxis: pick a fare, plan a lane route on the grid, follow it "on rails"
 *   MY TAXI ....... your driving, asking to pick up and drop off, publishing your car
 *   HUD & RESULTS . cash, the clock, the minimap, status lines, results, the daily board
 *   INPUT ......... keyboard and touch pads
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `k` (one JSON field: position, heading, speed)
 *     about 12 times a second, `n`/`c` (name, color) once and `hb` (heartbeat) once a second.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields: `shift` (id, v, phase,
 *     end time, every driver's cash and rides, the results: ONE JSON field, `v` only goes up),
 *     `fares` (every passenger: where they wait, where they go, who carries them, their
 *     deadline) and `bots` (the bot taxis, ~10 times a second). A new host adopts all three.
 *   - Drivers send intents to the host: "pickup" {i} when stopped by a waiting passenger and
 *     "drop" {i} when stopped at the destination. The host checks the driver's car in state
 *     and the first valid "pickup" wins. Its own pickups apply directly.
 *   - Effects are events: "paid" {by, amt, tip, x, z} (coins), "angry" {x, z} (a passenger gave
 *     up) and "honk". Everything they show is also in state.
 *   - Timers are timestamps: the shift's end and each ride's deadline.
 *   - Leaderboard "fares-YYYYMMDD": a new board each day (UTC); your total for the day.
 *   - Live ops: `fareBonus` multiplies every fare; running events show top right.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  grid: 5,               // roads each way: (grid - 1) × (grid - 1) blocks
  block: 26,             // distance between two roads
  road: 9,               // road width (two lanes)
  shiftMs: 150000,       // one shift
  resultsMs: 10000,      // the results card, then the next shift starts
  seats: 6,              // bot taxis fill the town up to this many taxis (12 at most fit the shared fields)
  maxSpeed: 26, accel: 17, brake: 36, reverse: 9, drag: 6, turn: 2.4,
  botSpeed: 20,          // bots' top speed (a little slower than you)
  waiting: [4, 9],       // passengers waiting at once: at least / at most (one more per taxi)
  patienceMs: 45000,     // a waiting passenger gives up after this long
  stopDist: 4.6,         // how close you must stop to pick up or drop off...
  stopSpeed: 3,          // ...and how slow
  baseFare: 6, perUnit: 0.2, // fare = base + per unit of road distance
  rideTime: [9000, 0.07],// ride time limit: ms + ms per unit of distance (× 1000)
  tipMax: 0.6,           // a quick ride tips up to this share of the fare
  fareBonus: 1,          // live ops: multiplies every fare (rush hour!)
  board: "fares",        // leaderboard prefix: one board a day, e.g. "fares-20261109"
};
const BOT_NAMES = ["Zippy", "Rosa", "Mack", "Dot", "Benny", "Lulu", "Gus", "Pepper", "Taz", "Moe", "Nell"];
const COLORS = ["#ff5a5f", "#3fa7ff", "#3ccf6e", "#b57bff", "#ff8a3d", "#ff6fb5", "#36d6c6", "#1d2b53", "#8bd450", "#e0457b", "#7a5cff", "#a0785a"];
const RIDERS = ["Mia", "Leo", "Ava", "Sam", "Zoe", "Max", "Ivy", "Ben", "Kim", "Raj", "Ana", "Tom", "Liv", "Eli"];
const SHIRTS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#da77f2", "#ffa94d", "#38d9a9", "#f783ac"], SKINS = ["#f5d0b0", "#e0ac7e", "#c68a5a", "#8d5a3b", "#ffe0c4"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'taxi-town',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");
if (ATTRACT) Object.assign(CONFIG, { seats: 7, waiting: [8, 11], patienceMs: 25000 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} }, reconnecting = false;
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) { const raw = S.shared[key], m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fallback); memo.set(key, { raw, v }); return v; }
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
/** A live-ops tunable: the owner's live config if it has one of the right type, else CONFIG. */
function liveCfg(k) { const v = net && net.live && net.live.config ? net.live.config[k] : undefined; return typeof v === typeof CONFIG[k] ? v : CONFIG[k]; }
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a), pick = (list) => list[Math.floor(Math.random() * list.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

// ── TOWN ────────────────────────────────────────────────────────────────────────────
// Roads run along x and z at roadAt(0..grid-1). Between them are blocks (kerb to kerb BLK wide).
// A "stop" is the kerb lane in the middle of one side of a block: where taxis stop for people.
const G = CONFIG.grid, B = CONFIG.block, RW = CONFIG.road, HALF = ((G - 1) * B) / 2, EDGE = HALF + RW / 2, BLK = B - RW, LANE = RW / 4;
const roadAt = (i) => -HALF + i * B;
const nodeXZ = (n) => ({ x: roadAt(n % G), z: roadAt(Math.floor(n / G)) });
const BLOCKS = [];
for (let bj = 0; bj < G - 1; bj++) for (let bi = 0; bi < G - 1; bi++) BLOCKS.push({ bi, bj, cx: roadAt(bi) + B / 2, cz: roadAt(bj) + B / 2, park: false });
const SOLIDS = BLOCKS.map((b) => ({ x0: b.cx - BLK / 2, x1: b.cx + BLK / 2, z0: b.cz - BLK / 2, z1: b.cz + BLK / 2 }));
const SIDES = { N: [0, -1], S: [0, 1], W: [-1, 0], E: [1, 0] };
const STOPS = []; // { x, z: where the taxi stops; px, pz: where the person stands; nx, nz: out of the block; dx, dz: driving direction; from: the node you come from }
for (const b of BLOCKS) for (const [side, [nx, nz]] of Object.entries(SIDES)) {
  const kx = b.cx + (nx * BLK) / 2, kz = b.cz + (nz * BLK) / 2, dx = -nz, dz = nx, x = kx + nx * LANE, z = kz + nz * LANE;
  const ends = nz ? [0, 1].map((k) => b.bi + k + (nz < 0 ? b.bj : b.bj + 1) * G) : [0, 1].map((k) => (nx < 0 ? b.bi : b.bi + 1) + (b.bj + k) * G);
  const from = ends.find((n) => { const p = nodeXZ(n); return (x - p.x) * dx + (z - p.z) * dz > 0; });
  STOPS.push({ x, z, px: kx - nx * 0.8, pz: kz - nz * 0.8, nx, nz, dx, dz, from, block: b, side });
}
const stopOf = (bi, bj, side) => STOPS.findIndex((s) => s.block.bi === bi && s.block.bj === bj && s.side === side);
const PLACES = [["CINEMA", "#e0457b", 0, 0, "S"], ["PIZZA", "#ff7a2f", 1, 0, "S"], ["HOTEL", "#7a5cff", 2, 0, "S"], ["BAKERY", "#d9902f", 3, 0, "W"],
  ["LIBRARY", "#3f7fd0", 0, 1, "E"], ["PARK", "#3ca85a", 1, 1, "N"], ["MALL", "#ff5a8a", 2, 1, "E"], ["GYM", "#e8453c", 3, 1, "S"],
  ["SCHOOL", "#f0b400", 0, 2, "N"], ["STATION", "#5a6b8c", 1, 3, "N"], ["HOSPITAL", "#2fb7a0", 2, 3, "E"], ["MUSEUM", "#a0785a", 3, 3, "N"]]
  .map(([name, color, bi, bj, side]) => ({ name, color, stop: stopOf(bi, bj, side) }));
for (const k of ["1,1", "2,2"]) BLOCKS.find((b) => b.bi + "," + b.bj === k).park = true;
/** Road distance between two stops (along the grid). */
const roadDist = (a, b) => Math.abs(STOPS[a].x - STOPS[b].x) + Math.abs(STOPS[a].z - STOPS[b].z);

// ── SCENE ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog("#cfe9ff", 90, 260);
const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 1200);
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
function canvasTex(w, h, paint, rx, ry) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }
  return t;
}
const mat = (color, more) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...more });
const add = (geo, m, x, y, z, shadow = true, parent = scene) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = shadow; o.receiveShadow = true; parent.add(o); return o; };
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), SC = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 24, 12), new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, depthWrite: false, map: canvasTex(4, 256, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#3d8fe0"); g.addColorStop(0.45, "#9fd6ff"); g.addColorStop(0.5, "#e6f5ff"); g.addColorStop(1, "#e6f5ff"); c.fillStyle = g; c.fillRect(0, 0, w, h);
}) })));
scene.add(new THREE.HemisphereLight("#ffffff", "#7a9a6a", 1.5));
const sun = new THREE.DirectionalLight("#fff3dc", 2.1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 1, far: 220 });
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(40, 80, 25);

// Ground, asphalt, kerbs and lane paint.
const grassTex = canvasTex(64, 64, (c, w, h) => { c.fillStyle = "#86c766"; c.fillRect(0, 0, w, h); for (let i = 0; i < 300; i++) { c.fillStyle = Math.random() < 0.5 ? "#7bbd5c" : "#92d070"; c.fillRect(Math.random() * w, Math.random() * h, 3, 3); } }, 80, 80);
add(new THREE.PlaneGeometry(1400, 1400).rotateX(-Math.PI / 2), mat("#ffffff", { map: grassTex }), 0, -0.02, 0, false);
const asphalt = canvasTex(64, 64, (c, w, h) => { c.fillStyle = "#5b616e"; c.fillRect(0, 0, w, h); for (let i = 0; i < 260; i++) { c.fillStyle = `rgba(255,255,255,${Math.random() * 0.07})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }, 30, 30);
add(new THREE.PlaneGeometry(EDGE * 2, EDGE * 2).rotateX(-Math.PI / 2), mat("#ffffff", { map: asphalt, roughness: 0.95 }), 0, 0, 0, false);
const kerbMat = mat("#d8d3c6"), lotMat = mat("#c9c3b4"), parkMat = mat("#ffffff", { map: grassTex });
for (const b of BLOCKS) {
  add(new THREE.BoxGeometry(BLK, 0.3, BLK), kerbMat, b.cx, 0.15, b.cz, false);
  add(new THREE.BoxGeometry(BLK - 3, 0.34, BLK - 3), b.park ? parkMat : lotMat, b.cx, 0.17, b.cz, false);
}
// Dashed center lines between crossings, and zebra crossings at every crossing.
const dashes = [], zebras = [];
for (let i = 0; i < G; i++) for (let s = 0; s < G - 1; s++) for (let t = RW / 2 + 2; t < B - RW / 2 - 1; t += 4) { dashes.push([roadAt(i), roadAt(s) + t, 0]); dashes.push([roadAt(s) + t, roadAt(i), 1]); }
for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) for (const [dx, dz] of Object.values(SIDES)) {
  const cx = roadAt(i) + dx * (RW / 2 + 1), cz = roadAt(j) + dz * (RW / 2 + 1);
  if (Math.abs(cx) > EDGE || Math.abs(cz) > EDGE) continue;
  for (let k = -3; k <= 3; k++) zebras.push([cx + (dz ? k * 1.2 : 0), cz + (dx ? k * 1.2 : 0), dx ? 1 : 0]);
}
const dashMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.28, 0.04, 2), new THREE.MeshBasicMaterial({ color: "#ffd84a" }), dashes.length);
dashes.forEach(([x, z, r], k) => dashMesh.setMatrixAt(k, M4.compose(V.set(x, 0.02, z), Q.setFromAxisAngle(UP, r ? Math.PI / 2 : 0), SC.set(1, 1, 1))));
const zebraMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 0.04, 2.2), new THREE.MeshBasicMaterial({ color: "#f4f4f4" }), zebras.length);

// ── DRIVING ─────────────────────────────────────────────────────────────────────────
/** One step of a car: inp = { gas, brake, steer (-1..1) }. Returns how hard it hit a kerb (0 = no bump). */
function drive(car, inp, dt, top) {
  if (inp.gas) car.v += CONFIG.accel * dt * (car.v < 0 ? 2.5 : 1);
  else if (inp.brake) car.v -= (car.v > 0.5 ? CONFIG.brake : CONFIG.accel * 0.6) * dt;
  else car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), CONFIG.drag * dt);
  car.v = clamp(car.v, -CONFIG.reverse, top);
  const grip = clamp(Math.abs(car.v) / 6, 0, 1) * Math.sign(car.v) * (1 - Math.min(0.3, Math.abs(car.v) / 90));
  car.h = wrap(car.h + inp.steer * CONFIG.turn * grip * dt);
  car.x += Math.sin(car.h) * car.v * dt; car.z += Math.cos(car.h) * car.v * dt;
  return collide(car);
}
/** Keep a car (a circle) off the kerbs and inside town. Losing speed depends on how square-on it hit. */
function collide(car) {
  const r = 1.5; let hit = 0;
  const push = (nx, nz, depth) => { car.x += nx * depth; car.z += nz * depth; const into = -(Math.sin(car.h) * nx + Math.cos(car.h) * nz) * Math.sign(car.v); if (into > 0.05) { hit = Math.max(hit, Math.abs(car.v) * into); car.v *= 1 - into * 0.75; } };
  for (const s of SOLIDS) {
    const cx = clamp(car.x, s.x0, s.x1), cz = clamp(car.z, s.z0, s.z1), dx = car.x - cx, dz = car.z - cz, d = Math.hypot(dx, dz);
    if (d >= r) continue;
    if (d > 1e-4) push(dx / d, dz / d, r - d);
    else { const o = [[-1, 0, car.x - s.x0 + r], [1, 0, s.x1 - car.x + r], [0, -1, car.z - s.z0 + r], [0, 1, s.z1 - car.z + r]].sort((a, b) => a[2] - b[2])[0]; push(o[0], o[1], o[2]); }
  }
  const lim = EDGE - r;
  if (car.x > lim) push(-1, 0, car.x - lim); if (car.x < -lim) push(1, 0, -lim - car.x);
  if (car.z > lim) push(0, -1, car.z - lim); if (car.z < -lim) push(0, 1, -lim - car.z);
  return hit;
}

  for (const o of others) { const dx = car.x - o.x, dz = car.z - o.z, d = Math.hypot(dx, dz); if (d < 3.4 && d > 0.01) { car.x += (dx / d) * (3.4 - d) * 0.5; car.z += (dz / d) * (3.4 - d) * 0.5; car.v *= 0.98; } }
}

  $("hint").textContent = touchUI ? "◀ ▶ to steer · GAS and BRAKE · HONK to say hi" : "WASD or arrows to drive · Space to brake · H to honk";
  // results
  $("over").hidden = r.ph !== "end" || overFor === r.id;
  if (r.ph === "end") {
    $("overSub").textContent = `You made $${(r.res.find((x) => x[4] === net.sessionId) || [0, 0])[1]} this shift · $${day.total} today`;
    $("results").innerHTML = r.res.map((x) => `<li class="${x[4] === net.sessionId ? "me" : ""}"><i style="background:${esc(x[3])}"></i>${esc(x[4] === net.sessionId ? "You" : x[0])} <small>· ${x[2]} ride${x[2] === 1 ? "" : "s"}</small><span>$${x[1]}</span></li>`).join("");
    $("overNext").textContent = `Next shift in ${Math.max(0, Math.ceil((r.ends - t) / 1000))}s`;
    if (showBoard.for !== r.id) { showBoard.for = r.id; showBoard(); }
  }
}
function showBoard() {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  (day.total ? boardToday().submit(day.total).catch(() => null) : Promise.resolve()).then(() => boardToday().top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Driver")}<span>$${e.score}</span></li>`).join("") : "<li>No fares yet today. Be the first!</li>";

}
// The minimap: roads, places, waiting passengers (gold), your destination (green), taxis.
const mini = $("mini"), mc = mini.getContext("2d");
function drawMini() {
  if (ATTRACT) return;
  const W = mini.width, k = (W - 16) / (EDGE * 2), X = (x) => 8 + (x + EDGE) * k, Z = (z) => 8 + (z + EDGE) * k;
  mc.clearRect(0, 0, W, W); mc.strokeStyle = "#8a93a8"; mc.lineWidth = RW * k;
  for (let i = 0; i < G; i++) { mc.beginPath(); mc.moveTo(X(roadAt(i)), Z(-HALF)); mc.lineTo(X(roadAt(i)), Z(HALF)); mc.moveTo(X(-HALF), Z(roadAt(i))); mc.lineTo(X(HALF), Z(roadAt(i))); mc.stroke(); }
  const ride = carrying(net.sessionId);
  for (const f of fareList()) if (f.st === "w") { mc.fillStyle = "#ffd84a"; mc.beginPath(); mc.arc(X(STOPS[f.p].x), Z(STOPS[f.p].z), 7, 0, 7); mc.fill(); }
  if (ride) { const p = PLACES[ride.d]; mc.strokeStyle = "#5dff8a"; mc.lineWidth = 5; mc.beginPath(); mc.arc(X(p.x), Z(p.z), 12, 0, 7); mc.stroke(); }
  for (const c of cars()) {

}
let audio = null;
const wakeAudio = () => { if (!audio) try { audio = new AudioContext(); } catch {} else if (audio.state === "suspended") audio.resume(); };
function sfx(freq, dur, type = "square", vol = 0.04, slideTo = 0) {
  if (!audio || ATTRACT) return;
  try {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);

}
const sfxCash = () => { sfx(1320, 0.08, "square", 0.04); setTimeout(() => sfx(1760, 0.18, "square", 0.04), 80); };
const sfxHonk = (vol = 0.05) => { sfx(392, 0.28, "sawtooth", vol); sfx(494, 0.28, "sawtooth", vol * 0.8); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowUp: "gas", w: "gas", W: "gas", ArrowDown: "brake", s: "brake", S: "brake", " ": "brake" };
function honk() {
  if (performance.now() - (honk.at || 0) < 600) return; honk.at = performance.now();
  net.send("honk", {}); honkFx(net.sessionId);
}
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } if (e.key === "h" || e.key === "H") honk(); });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
addEventListener("blur", () => { for (const k in input) input[k] = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k, on = (v) => { if (k === "honk") { if (v) honk(); } else input[k] = v; b.classList.toggle("on", v); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); b.setPointerCapture(e.pointerId); on(true); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => on(false));
}
$("again").onclick = () => { overFor = shift()?.id ?? -1; };
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
renderer.domElement.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
const views = new Map(), people = new Map(); // id -> taxi model, fare id -> person model
const honks = new Map();
function honkFx(id) { honks.set(id, performance.now()); const c = carOf(id); if (c) popText("HONK!", c.x, 4.2, c.z, "#ffffff"); if (c && Math.hypot(c.x - me.x, c.z - me.z) < 60) sfxHonk(id === net.sessionId ? 0.05 : 0.03); }
let last = performance.now(), lastHb = 0, lastHud = 0, lastMini = 0, myTaxi = null;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const r = shift();
  if (r) trackCash(r);
  myTick(dt, now, r); publish(now);
  // other taxis: people from their entities (predicted from speed and heading, then eased), bots from the host
  const seen = new Set(), live = new Set(livePlayers()), riders = new Map(fareList().filter((f) => f.st === "r").map((f) => [f.by, f]));
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.k, null); if (!k) continue;
    seen.add(id); place(viewOf(id, p.c || "#ccc", p.n || "Driver"), k, dt, riders.has(id));
  }
  for (const b of botList()) { seen.add(b.i); const v = viewOf(b.i, b.c, b.n); if (hosting()) { v.x = b.x; v.z = b.z; v.h = b.h; v.v = b.v; poseTaxi(v.m, b.x, b.z, b.h, b.v, dt, riders.has(b.i)); } else place(v, b, dt, riders.has(b.i)); }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.m.g); views.delete(id); }
  if (!myTaxi || myTaxi.color !== myColor) { if (myTaxi) scene.remove(myTaxi.g); myTaxi = makeTaxi(myColor, ""); myTaxi.color = myColor; }
  poseTaxi(myTaxi, me.x, me.z, me.h, me.v, dt, riders.has(net.sessionId), me.roll);
  drawPassengers(t);
  guide(t);
  walkersTick(dt, t); effectsTick(dt, t);
  // chase camera, a little higher on a tall screen (and for the ?attract preview, so it sees more of the chase)
  const tall = camera.aspect < 1, back = tall ? 18 : ATTRACT ? 15 : 15, up = tall ? 15 : ATTRACT ? 15 : 11;
  const fx = Math.sin(me.h), fz = Math.cos(me.h);
  camPos.set(me.x - fx * back, up, me.z - fz * back);
  camera.position.lerp(camPos, 1 - Math.pow(ATTRACT ? 0.02 : 0.004, dt));
  camLook.lerp(V.set(me.x + fx * 9, 0, me.z + fz * 9), 1 - Math.pow(ATTRACT ? 0.01 : 0.0005, dt));
  camera.lookAt(camLook);
  if (shake > 0) { camera.position.x += rnd(-shake, shake); camera.position.y += rnd(-shake, shake); shake = Math.max(0, shake - dt * 1.5); }
  sun.position.set(me.x + SUN_OFF.x, SUN_OFF.y, me.z + SUN_OFF.z); sun.target.position.set(me.x, 0, me.z);
  renderer.render(scene, camera);
  if (now - lastHud > 100) { lastHud = now; hud(r, now); }
  if (now - lastMini > 150) { lastMini = now; drawMini(); }
  requestAnimationFrame(frame);
}
function viewOf(id, color, name) {
  let v = views.get(id);
  if (v && v.color !== color) { scene.remove(v.m.g); v = null; views.delete(id); } // they changed color
  if (!v) { v = { m: makeTaxi(color, ATTRACT ? "" : name), color, x: 0, z: 0, h: 0, v: 0, fresh: true, raw: "", at: 0 }; views.set(id, v); }
  return v;
}
/** Ease another car toward where it should be now: its last report plus how far it has driven since. */
function place(v, k, dt, isCarrying) {
  const raw = k.x + "," + k.z + "," + k.h;
  if (raw !== v.raw) { v.raw = raw; v.at = performance.now(); }
  const age = Math.min(0.3, (performance.now() - v.at) / 1000), px = k.x + Math.sin(k.h) * k.v * age, pz = k.z + Math.cos(k.h) * k.v * age;
  if (v.fresh || Math.hypot(px - v.x, pz - v.z) > 15) { v.x = px; v.z = pz; v.h = k.h; v.fresh = false; }
  const e = 1 - Math.pow(0.001, dt);
  v.x += (px - v.x) * e; v.z += (pz - v.z) * e; v.h += wrap(k.h - v.h) * e; v.v = k.v;
  poseTaxi(v.m, v.x, v.z, v.h, v.v, dt, isCarrying);

/** Waiting passengers wave at the kerb; anyone riding is a head in the back seat. */
function drawPassengers(t) {
  const seen = new Set();
  for (const f of fareList()) {
    if (f.st !== "w") continue;
    let p = people.get(f.i);
    if (!p) { p = makePerson(SHIRTS[f.s] || SHIRTS[0], SKINS[f.k] || SKINS[0]); people.set(f.i, p); const s = STOPS[f.p]; p.g.position.set(s.px, 0.34, s.pz); p.g.rotation.y = Math.atan2(s.nx, s.nz); p.born = t; }
    seen.add(f.i);
    p.arm.rotation.z = Math.PI - 0.4 + Math.sin(t * 9 + f.i) * 0.45;
    p.coin.position.y = 3.6 + Math.sin(t * 3 + f.i) * 0.25; p.coin.material.rotation = Math.sin(t * 2 + f.i) * 0.3;
    p.g.scale.setScalar(Math.min(1, (t - p.born) * 3));

  for (const [i, p] of people) if (!seen.has(i)) { scene.remove(p.g); people.delete(i); }
}
/** The arrow over my taxi and the green light at my destination. */
function guide(t) {
  const ride = carrying(net.sessionId), r = shift();
  let target = null;
  if (ride) target = PLACES[ride.d];
  else { const near = fareList().filter((f) => f.st === "w").map((f) => STOPS[f.p]).sort((a, b) => Math.hypot(a.x - me.x, a.z - me.z) - Math.hypot(b.x - me.x, b.z - me.z))[0]; if (near) target = near; }
  goal.visible = !!ride && !ATTRACT;
  if (ride) { goal.position.set(target.x, 0, target.z); goalRing.scale.setScalar(1 + Math.sin(t * 5) * 0.06); }
  arrow.visible = !!target && !ATTRACT && r?.ph === "on" && Math.hypot(target.x - me.x, target.z - me.z) > 9;
  if (arrow.visible) { arrow.position.set(me.x, 3.6 + Math.sin(t * 4) * 0.15, me.z); arrow.rotation.y = Math.atan2(target.x - me.x, target.z - me.z); arrow.material.color.set(ride ? "#5dff8a" : "#ffd84a"); }

/** Two people joined at once in one color: the one with the higher sessionId picks a free one (bots' colors count as taken). */

  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.some((b) => b.c === myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots.map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("pickup", (m, from) => { if (isHost()) applyPickup(from, m); });
  net.on("drop", (m, from) => { if (isHost()) applyDrop(from, m); });
  net.on("paid", (m) => { if (m && typeof m.x === "number") paidFx(m); });
  net.on("angry", (m) => { if (m && typeof m.x === "number") angryFx(m); });
  net.on("honk", (m, from) => honkFx(from));
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  net.onLive((live) => { $("event").textContent = (live && live.active || []).map((e) => e.title).join(" · "); });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl });
  loadDay();
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);

  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  camera.position.set(me.x - Math.sin(me.h) * 14, 9, me.z - Math.cos(me.h) * 14); camLook.set(me.x, 1, me.z);

  requestAnimationFrame(frame);
})();
